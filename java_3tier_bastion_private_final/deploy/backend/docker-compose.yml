services:
  backend:
    image: ${DOCKERHUB_USERNAME}/java3tier-backend:latest
    container_name: java3tier-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_PRIVATE_IP}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
